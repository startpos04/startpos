<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You're offline</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0a0a0a;
        color: #f4f4f5;
      }
      .card {
        max-width: 420px;
        text-align: center;
      }
      .icon {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        opacity: 0.8;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        line-height: 1.5;
        color: #a1a1aa;
        margin: 0 0 24px;
      }
      #status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: #a1a1aa;
        margin-bottom: 20px;
      }
      #status .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #ef4444;
      }
      button {
        appearance: none;
        border: 1px solid #27272a;
        background: #18181b;
        color: #f4f4f5;
        font-size: 14px;
        font-weight: 500;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
      }
      button:hover {
        background: #27272a;
      }
      button:active {
        transform: translateY(1px);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <svg
        class="icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M12 20h.01" />
        <path d="M8.5 16.5a5 5 0 0 1 7 0" />
        <path d="M5 12.5a10 10 0 0 1 14 0" />
        <path d="M1.5 9a15 15 0 0 1 21 0" />
        <line x1="2" y1="2" x2="22" y2="22" />
      </svg>
      <h1>You're offline</h1>
      <p>
        We couldn't reach the server and this page hasn't been saved for offline use yet.
        Check your connection — the app will reload automatically once you're back online.
      </p>
      <div id="status">
        <span class="dot"></span>
        <span id="status-text">No connection</span>
      </div>
      <br />
      <button onclick="window.location.reload()">Try again</button>
    </div>

    <script>
      // Auto-reload the moment connectivity returns, and reflect live status
      // so the user isn't left guessing whether anything is happening.
      function updateStatus() {
        var dot = document.querySelector('#status .dot');
        var text = document.getElementById('status-text');
        if (navigator.onLine) {
          dot.style.background = '#22c55e';
          text.textContent = 'Back online — reloading…';
          window.location.reload();
        } else {
          dot.style.background = '#ef4444';
          text.textContent = 'No connection';
        }
      }

      window.addEventListener('online', updateStatus);
      window.addEventListener('offline', updateStatus);
      updateStatus();
    </script>
  </body>
</html>

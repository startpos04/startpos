services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_HOST_PORT:-5434}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  db-init:
    image: postgres:15-alpine
    env_file:
      - .env
    volumes:
      - ./startpos-core/prisma/models/ensure-database.sh:/ensure-database.sh:ro
    entrypoint: ['/bin/sh', '/ensure-database.sh']
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
    networks:
      - app-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    depends_on:
      db-init:
        condition: service_completed_successfully
    ports:
      - '${PUBLIC_PORT:-3200}:${PORT:-3000}'
    env_file:
      - .env
    shm_size: '1gb'
    volumes:
      - app_output:/app/.output
      - ./.env:/app/.env:ro
    command: ['pnpm', 'run', 'dev:docker']
    networks:
      - app-network
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
            - .output/
            - .git/
        - action: rebuild
          path: package.json
        - action: rebuild
          path: pnpm-lock.yaml

  stripe-setup:
    build:
      context: ./payment-stripe
      dockerfile: Dockerfile
    profiles:
      - stripe
    # One-shot: exits after creating/reconciling all Stripe products and prices.
    # docker-compose will not restart it once it finishes successfully.
    command: ["/scripts/setup.sh"]
    restart: "no"
    environment:
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    volumes:
      - stripe_config:/root/.config/stripe
      # Generated env file — lands at ./payment-stripe/env/stripe.env on the host.
      - ./payment-stripe/env:/stripe-env
      # Workspace root — gives the script direct write access to .env.
      - .:/host-env
    networks:
      - app-network

  stripe-webhook:
    build:
      context: ./payment-stripe
      dockerfile: Dockerfile
    profiles:
      - stripe
    # Long-running: stays up forwarding events to the app container.
    # Restarts automatically if the CLI disconnects.
    command: ["/scripts/webhook.sh"]
    restart: unless-stopped
    depends_on:
      stripe-setup:
        condition: service_completed_successfully
    environment:
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      # Override if your webhook route differs from the default below.
      STRIPE_WEBHOOK_FORWARD_URL: ${STRIPE_WEBHOOK_FORWARD_URL:-http://app:3000/api/stripe/webhook}
    volumes:
      - stripe_config:/root/.config/stripe
      # Shared with stripe-setup so the webhook service can read the API key.
      - ./payment-stripe/env:/stripe-env
      # Workspace root — gives the script direct write access to .env.
      - .:/host-env
    networks:
      - app-network

volumes:
  postgres_data:
  app_output:
  stripe_config:

networks:
  app-network:
    driver: bridge

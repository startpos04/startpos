services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - apps/web/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_HOST_PORT:-5434}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  db-init:
    image: postgres:15-alpine
    env_file:
      - apps/web/.env
    environment:
      POSTGRES_HOST: db
    volumes:
      - ./packages/platform/prisma/models/ensure-database.sh:/ensure-database.sh:ro
    entrypoint: ['/bin/sh', '/ensure-database.sh']
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
    networks:
      - app-network

  app:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    depends_on:
      db-init:
        condition: service_completed_successfully
    ports:
      - '${PUBLIC_PORT:-3200}:${PORT:-3000}'
    env_file:
      - apps/web/.env
    environment:
      POSTGRES_HOST: db
      DOCKER_DEV: "true"
    shm_size: '1gb'
    volumes:
      - app_output:/app/apps/web/.output
      - ./apps/web/.env:/app/apps/web/.env:ro
    command: ['pnpm', '--filter', '@startpos/web', 'run', 'dev:docker']
    networks:
      - app-network
    develop:
      watch:
        - action: sync
          path: ./apps/web
          target: /app/apps/web
          ignore:
            - node_modules/
            - .output/
        - action: sync
          path: ./packages/platform
          target: /app/packages/platform
          ignore:
            - node_modules/
        - action: rebuild
          path: apps/web/package.json
        - action: rebuild
          path: packages/platform/package.json
        - action: rebuild
          path: pnpm-lock.yaml

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      target: dev
    depends_on:
      db-init:
        condition: service_completed_successfully
    ports:
      - '${ADMIN_PUBLIC_PORT:-3201}:${ADMIN_PORT:-3001}'
    env_file:
      - apps/admin/.env
    environment:
      POSTGRES_HOST: db
      DOCKER_DEV: "true"
    volumes:
      - admin_output:/app/apps/admin/.output
      - ./apps/admin/.env:/app/apps/admin/.env:ro
    command: ['pnpm', '--filter', '@startpos/admin', 'run', 'dev:docker']
    networks:
      - app-network
    develop:
      watch:
        - action: sync
          path: ./apps/admin
          target: /app/apps/admin
          ignore:
            - node_modules/
            - .output/
        - action: sync
          path: ./packages/platform
          target: /app/packages/platform
          ignore:
            - node_modules/
        - action: rebuild
          path: apps/admin/package.json
        - action: rebuild
          path: packages/platform/package.json
        - action: rebuild
          path: pnpm-lock.yaml

  stripe-setup:
    build:
      context: ./apps/stripe
      dockerfile: Dockerfile
    profiles:
      - stripe
    command: ["/scripts/setup.sh"]
    restart: "no"
    environment:
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    volumes:
      - stripe_config:/root/.config/stripe
      - ./apps/stripe/env:/stripe-env
      - ./apps/web:/host-env
    networks:
      - app-network

  stripe-webhook:
    build:
      context: ./apps/stripe
      dockerfile: Dockerfile
    profiles:
      - stripe
    command: ["/scripts/webhook.sh"]
    restart: unless-stopped
    depends_on:
      stripe-setup:
        condition: service_completed_successfully
    environment:
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_FORWARD_URL: ${STRIPE_WEBHOOK_FORWARD_URL:-http://app:3000/api/stripe/webhook}
    volumes:
      - stripe_config:/root/.config/stripe
      - ./apps/stripe/env:/stripe-env
      - ./apps/web:/host-env
    networks:
      - app-network

volumes:
  postgres_data:
  app_output:
  admin_output:
  stripe_config:

networks:
  app-network:
    driver: bridge
